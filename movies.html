        <script>
        document.addEventListener('dataReady', () => {
            const filter = new URLSearchParams(location.search).get('filter');
            if(!filter) return;
            const list = filter === 'trending' ? trending : kids;
            document.querySelector('h2').textContent = filter === 'trending' ? 'Trending' : 'Kids';
            document.querySelector('.movies-grid').innerHTML = list.map((m,i)=>`
            <a href="movie-selected.html?movie=${i}&type=${filter}" class="movie-card"><img src="${m.cover}" alt="${m.title}"></a>
            `).join('');
        });
        </script>
