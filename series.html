<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series</title>
     <link rel="stylesheet" href="series.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
        <nav>
            <img class="light-logo" src="assets/logo-light-1.svg">
            <div class="nav-bar" id="navBar">
                <button class="close-btn" id="closeBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#price">Pricing</a></li>
                    <li><a href="movies.html">Movies</a></li>
                    <li><a href="series.html">Series</a></li>
                    <li><a href="collection.html">Collection</a></li>
                    <li><a href="index.html#faq">FAQ</a></li>
                </ul>
            </div>

            <div class="hero-logos">
                <img src="assets/search-interaction.svg" alt="">
                <img src="assets/bell-notif.svg" alt="">

                <!-- PROFILE DROPDOWN - SAME FORMAT AS INDEX / MOVIES, NO SETTINGS -->
                <div class="profile-wrapper">
                    <img id="navAvatar" src="assets/profile-1.svg" alt="profile" class="nav-avatar">
                    <i class="fa-solid fa-caret-down profile-caret"></i>

                    <div id="profileDropdown" class="profile-dropdown hidden">
                        <div class="dropdown-header">
                            <img id="dropdownAvatar" src="assets/profile-1.svg" alt="Profile">
                            <div>
                                <p id="dropdownName">My Profile</p>
                                <span>Manage your account</span>
                            </div>
                        </div>

                        <button id="changePicBtn" class="dropdown-item" type="button">
                            <i class="fa-solid fa-camera"></i> Change Profile Picture
                        </button>
                        <input type="file" id="profilePicInput" accept="image/*" hidden>

                        <button id="myProfileBtn" class="dropdown-item" type="button">
                            <i class="fa-solid fa-user"></i> My Profile
                        </button>

                        <hr>
                        <button id="logoutBtn" class="dropdown-item logout" type="button">
                            <i class="fa-solid fa-right-from-bracket"></i> Log Out
                        </button>
                    </div>
                </div>

                <button id="themeToggle" style="background:none; border:none; cursor:pointer; font-size:20px; color:white;">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>

            <button class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>

        <section>
            <h2>Series</h2>
            <div class="search-bar">
                <input type="text" placeholder="Search series">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

        <div class="movies">
        <div class="movies-grid" id="seriesGrid">
        </div>
        </div>
        </section>

        <script src="movie_db.js"></script>
        <script src="script.js"></script>
        <script>
            document.addEventListener('dataReady', () => {
                const grid = document.getElementById('seriesGrid');

                const localCovers = [
                    'assets/series-1.svg',
                    'assets/series-2.svg',
                    'assets/series-3.svg',
                    'assets/series-4.svg',
                    'assets/series-5.svg',
                    'assets/series-6.svg',
                    'assets/series-7.svg',
                    'assets/series-8.svg',
                    'assets/series-9.svg',
                    'assets/series-10.svg'
                ];

                function renderSeries(filterText = '') {
                    const q = filterText.toLowerCase();
                    grid.innerHTML = series.map((s, i) => {
                        if(q && !s.title.toLowerCase().includes(q)) return '';
                        const img = localCovers[i] || s.cover;
                        return `<a href="movie-selected.html?movie=${i}&type=series" class="movie-card"><img src="${img}" alt="${s.title}"></a>`;
                    }).join('');
                }

                renderSeries();

                const input = document.querySelector('.search-bar input');
                input.addEventListener('input', () => {
                    renderSeries(input.value);
                });
            });
            </script>
        <script>
          const savedSeries = JSON.parse(localStorage.getItem('movieUser') || 'null');
          if (savedSeries) {
            const navAvatar = document.getElementById('navAvatar');
            const dropdownAvatar = document.getElementById('dropdownAvatar');
            const dropdownName = document.getElementById('dropdownName');
            const pic = savedSeries.avatar || localStorage.getItem('userProfilePic');
            if (pic) {
              if (navAvatar) navAvatar.src = pic;
              if (dropdownAvatar) dropdownAvatar.src = pic;
            }
            if (savedSeries.name && dropdownName) dropdownName.textContent = savedSeries.name;
            if (savedSeries.email && dropdownName && !savedSeries.name) dropdownName.textContent = savedSeries.email;
          }
        </script>
    </body>
</html>
