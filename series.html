<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series</title>
     <link rel="stylesheet" href="series.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
        <nav>
            <img class="light-logo" src="assets/logo-light-1.svg">
            <div class="nav-bar" id="navBar">
                <button class="close-btn" id="closeBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <ul>
                    <li><a href="#Home">Home</a></li>
                    <li><a href="#price">Pricing</a></li>
                    <li><a href="#movies-section">Movies</a></li>
                    <li><a href="#series-section">Series</a></li>
                    <li><a href="#collection">Collection</a></li>
                    <li><a href="#faq">FAQ</a></li>
                </ul>
            </div>

            <div class="hero-logos">
                <img src="assets/search-interaction.svg" alt="">
                <img src="assets/bell-notif.svg" alt="">
                <img src="assets/log-in-interaction.svg" alt="">
                <img src="assets/sun.svg" alt="">
            </div>

            <button class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>

        <section>
            <h2>Series</h2>
            <div class="search-bar">
                <input type="text" placeholder="Search series">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="movies">
                <div class="movies-grid">
                    <img src="assets/series-7.svg" alt="">
                    <img src="assets/series-1.svg" alt="">
                    <img src="assets/series-3.svg" alt="">
                    <img src="assets/series-4.svg" alt="">
                    <img src="assets/series-6.svg" alt="">
                    <img src="assets/series-2.svg" alt="">
                    <img src="assets/series-8.svg" alt="">
                    <img src="assets/series-5.svg" alt="">
                    <img src="assets/series-9.svg" alt="">
                    <img src="assets/series-10.svg" alt="">
                </div>

            </div>
        </section>

        <script>
            const hamburger = document.getElementById('hamburger');
            const navBar = document.getElementById('navBar');
            const closeBtn = document.getElementById('closeBtn');

            hamburger.addEventListener('click', () => {
                navBar.classList.add('active');
            });

            closeBtn.addEventListener('click', () => {
                navBar.classList.remove('active');
            });

            document.querySelectorAll('.nav-bar a').forEach(link => {
                link.addEventListener('click', () => {
                navBar.classList.remove('active');
                });
            });
        </script>
</body>
</html>
