<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series</title>
     <link rel="stylesheet" href="series.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" referrerpolicy="no-referrer" />
</head>
<body>
        <nav>
            <img class="light-logo" src="assets/logo-light-1.svg">
            <div class="nav-bar" id="navBar">
                <button class="close-btn" id="closeBtn">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#price">Pricing</a></li>
                    <li><a href="movies.html">Movies</a></li>
                    <li><a href="series.html">Series</a></li>
                    <li><a href="collection.html">Collection</a></li>
                    <li><a href="index.html#faq">FAQ</a></li>
                </ul>
            </div>

            <div class="hero-logos">
                <img src="assets/search-interaction.svg" alt="">
                <img src="assets/bell-notif.svg" alt="">
                <img src="assets/log-in-interaction.svg" alt="">
                <img src="assets/sun.svg" alt="">
            </div>

            <button class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>

        <section>
            <h2>Series</h2>
            <div class="search-bar">
                <input type="text" placeholder="Search series">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

        <div class="movies">
        <div class="movies-grid" id="seriesGrid">
        </div>
        </div>
        </section>

        <script src="movie_db.js"></script>
        <script src="script.js"></script>
        <script>
            document.addEventListener('dataReady', () => {
                const grid = document.getElementById('seriesGrid');

                const localCovers = [
                    'assets/series-1.svg',
                    'assets/series-2.svg',
                    'assets/series-3.svg',
                    'assets/series-4.svg',
                    'assets/series-5.svg',
                    'assets/series-6.svg',
                    'assets/series-7.svg',
                    'assets/series-8.svg',
                    'assets/series-9.svg',
                    'assets/series-10.svg'
                ];

                function renderSeries(filterText = '') {
                    const q = filterText.toLowerCase();
                    grid.innerHTML = series.map((s, i) => {
                        if(q && !s.title.toLowerCase().includes(q)) return '';
                        const img = localCovers[i] || s.cover;
                        return `<a href="movie-selected.html?movie=${i}&type=series" class="movie-card"><img src="${img}" alt="${s.title}"></a>`;
                    }).join('');
                }

                renderSeries();

                const input = document.querySelector('.search-bar input');
                input.addEventListener('input', () => {
                    renderSeries(input.value);
                });
            });
            </script>
    </body>
</html>
