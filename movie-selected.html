<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Movie</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="movie-selected.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="movie-page">

  <section class="movie-hero" id="movieHero">
    <nav class="movie-nav">
      <img class="light-logo" src="assets/logo-light-1.svg" alt="Logo">
      <div class="nav-bar" id="navBar">
        <button class="close-btn" id="closeBtn">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#price">Pricing</a></li>
          <li><a href="movies.html">Movies</a></li>
          <li><a href="series.html">Series</a></li>
          <li><a href="collection.html">Collection</a></li>
          <li><a href="index.html#faq">FAQ</a></li>
        </ul>
      </div>
      <div class="hero-logos">
        <img src="assets/search-interaction.svg" alt="Search">
        <img src="assets/bell-notif.svg" alt="Notifications">
        <img src="assets/log-in-interaction.svg" alt="Login">
        <img src="assets/sun.svg" alt="Theme">
      </div>
      <button class="hamburger" id="hamburger">
        <i class="fa-solid fa-bars"></i>
      </button>
    </nav>

    <div class="movie-hero-content">
      <div class="hero-left">
        <h1 id="movieTitle">Loading...</h1>
        <p class="movie-meta" id="movieMeta">...</p>
        <p class="movie-stars">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
        </p>
        <div class="movie-icons">
          <button class="icon-btn"><i class="fa-regular fa-bookmark"></i></button>
          <button class="icon-btn"><i class="fa-regular fa-thumbs-up"></i></button>
          <button class="icon-btn"><i class="fa-regular fa-thumbs-down"></i></button>
        </div>
      </div>

      <div class="hero-right">
        <img src="assets/jw4-logo.svg" class="jw-logo" alt="" id="movieLogo">
        <div class="movie-buttons">
          <button class="btn-watch" id="watchBtn"><i class="fa-solid fa-play"></i> Watch Now</button>
          <button class="btn-preview" id="previewBtn">Preview</button>
        </div>
      </div>
    </div>

    <div class="scenes">
      <img src="assets/scene-1.svg" alt="Scene 1">
      <img src="assets/scene-2.svg" alt="Scene 2">
      <img src="assets/scene-3.svg" alt="Scene 3">
      <img src="assets/scene-4.svg" alt="Scene 4">
      <img src="assets/scene-5.svg" alt="Scene 5">
    </div>
  </section>

  <section class="about">
    <h1 id="aboutTitle">about Movie</h1>
    <p id="movieDesc">Loading description...</p>
    <h1>Genres</h1>
    <div class="genres" id="movieGenres">
      <span class="genre">Action</span>
    </div>
    <h1>Characters</h1>
    <div class="characters">
      <img src="assets/character-8.svg" alt="">
      <img src="assets/character-9.svg" alt="">
      <img src="assets/character-10.svg" alt="">
      <img src="assets/character-11.svg" alt="">
      <img src="assets/character-12.svg" alt="">
    </div>
    <h1>Director</h1>
    <div class="characters">
      <img src="assets/director.svg" alt="Director">
    </div>
  </section>

  <section class="suggestion">
    <div class="section-top"><h1 id="suggestTitle">You may also like</h1></div>
    <div class="suggestion-grid" id="suggestionGrid"></div>
  </section>

  <footer class="movie-footer">
    <div class="footer-links">
      <a href="#">Get the OMO App <i class="fa-solid fa-chevron-right"></i></a>
      <a href="#">Help <i class="fa-solid fa-chevron-right"></i></a>
      <a href="#">Site Index <i class="fa-solid fa-chevron-right"></i></a>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="movie_db.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const movieIndex = parseInt(params.get('movie')) || 0;
      const type = params.get('type') || 'movie';

      document.addEventListener('dataReady', () => {
        let list = movies;
        if(type === 'series') list = series;
        if(type === 'kids') list = kids;
        if(type === 'trending') list = trending;

        const movie = list[movieIndex] || list[0];
        if(!movie) return;

        document.getElementById('pageTitle').textContent = movie.title;
        document.getElementById('movieTitle').textContent = movie.title;
        document.getElementById('aboutTitle').textContent = 'about ' + movie.title;
        document.getElementById('movieDesc').textContent = movie.description || 'No description';
        document.getElementById('movieMeta').textContent = (movie.year||'') + ' • ' + (movie.rating||'') + ' • ' + (movie.genre||'');
        document.getElementById('movieGenres').innerHTML = `<span class="genre">${movie.genre || movie.category}</span>`;

        if(movie.thumbnails || movie.cover){
          document.getElementById('movieHero').style.backgroundImage = `url(${movie.thumbnails || movie.cover})`;
          document.getElementById('movieHero').style.backgroundSize = 'cover';
          document.getElementById('movieHero').style.backgroundPosition = 'center';
        }

        document.getElementById('watchBtn').onclick = () => window.open(movie.url, '_blank');
        document.getElementById('previewBtn').onclick = () => window.open(movie.url, '_blank');

        const grid = document.getElementById('suggestionGrid');
        grid.innerHTML = '';
        list.slice(0,6).forEach((m,i)=>{
          if(i!==movieIndex) grid.innerHTML += `<div class="suggestion-card"><a href="movie-selected.html?movie=${i}&type=${type}"><img src="${m.cover}" alt="${m.title}"></a></div>`;
        });
      });
    </script>
</body>
</html>
